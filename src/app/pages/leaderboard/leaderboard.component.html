<div class="page-shell">
  <div class="page-container page-enter">
    <app-card>
      <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex items-center gap-2.5">
          <app-logo size="sm"></app-logo>
          <div>
            <h1 class="text-xl font-semibold lg:text-2xl">Leaderboard</h1>
            <p class="text-sm text-slate-500">Top scores this week</p>
          </div>
        </div>
        <button type="button" (click)="back()" class="link-back sm:shrink-0">← Back to results</button>
      </div>

      <div class="tab-group mt-6 max-w-xl">
        <button
          type="button"
          (click)="selectTab('class')"
          class="tab-item"
          [ngClass]="selectedTab === 'class' ? 'tab-item-active' : ''">
          My Class
        </button>
        <button
          type="button"
          (click)="selectTab('age')"
          class="tab-item"
          [ngClass]="selectedTab === 'age' ? 'tab-item-active' : ''">
          My Age Group
        </button>
        <button
          type="button"
          (click)="selectTab('category')"
          class="tab-item"
          [ngClass]="selectedTab === 'category' ? 'tab-item-active' : ''">
          By Category
        </button>
      </div>

      <div class="mt-6 divide-y divide-slate-100 rounded-lg border border-slate-200">
        @for (player of leaderboard; track player.rank) {
          <div
            class="flex items-center justify-between px-4 py-3 transition-colors lg:px-5 lg:py-3.5"
            [ngClass]="[
              player.me ? 'bg-brand-50' : 'bg-white hover:bg-slate-50',
              player.rank === 1 ? 'rank-gold' : '',
              player.rank === 2 ? 'rank-silver' : '',
              player.rank === 3 ? 'rank-bronze' : ''
            ]">
            <div class="flex items-center gap-3 lg:gap-4">
              <div class="w-8 text-center text-sm font-semibold text-slate-500 lg:w-10">
                @switch (player.rank) {
                  @case (1) { 🥇 }
                  @case (2) { 🥈 }
                  @case (3) { 🥉 }
                  @default { {{ player.rank }} }
                }
              </div>

              <div class="flex h-9 w-9 items-center justify-center rounded-full bg-brand-50 text-lg lg:h-10 lg:w-10">
                {{ player.avatar }}
              </div>

              <div class="flex items-center gap-2">
                <span class="text-sm font-medium text-slate-800 lg:text-base">{{ player.name }}</span>
                @if (player.me) {
                  <span class="chip bg-brand-600 text-white">You</span>
                }
              </div>
            </div>

            <span class="text-sm font-semibold tabular-nums text-slate-800 lg:text-base">
              {{ player.points }}
              <span class="text-xs font-normal text-slate-400">pts</span>
            </span>
          </div>
        }
      </div>
    </app-card>
  </div>
</div>
