<div class="min-h-screen bg-[radial-gradient(circle_at_top,_#eef2ff,_#f8fafc_45%,_#e2e8f0)] px-4 py-6 md:px-8 md:py-10">

    <div class="mx-auto flex w-full max-w-6xl justify-center">

        <app-card
            styleClass="w-full max-w-xl rounded-3xl border border-slate-200 bg-white/95 shadow-2xl backdrop-blur p-8">

            <!-- Header -->

            <div class="flex items-center justify-between">

                <h1 class="text-3xl font-bold text-slate-900">

                    Leaderboard 🏆

                </h1>

                <button
                    (click)="back()"
                    class="text-sm font-medium text-[#6D47C4] hover:underline">

                    ← Back to Results

                </button>

            </div>

            <!-- Tabs -->

            <div class="mt-8 flex rounded-xl bg-slate-100 p-1">

                <button
                    (click)="selectTab('class')"
                    class="rounded-lg px-5 py-2 text-sm font-medium transition"
                    [ngClass]="selectedTab === 'class'
                        ? 'bg-[#6D47C4] text-white shadow'
                        : 'text-slate-500 hover:text-slate-700'">

                    My Class

                </button>

                <button
                    (click)="selectTab('age')"
                    class="rounded-lg px-5 py-2 text-sm font-medium transition"
                    [ngClass]="selectedTab === 'age'
                        ? 'bg-[#6D47C4] text-white shadow'
                        : 'text-slate-500 hover:text-slate-700'">

                    My Age Group

                </button>

                <button
                    (click)="selectTab('category')"
                    class="rounded-lg px-5 py-2 text-sm font-medium transition"
                    [ngClass]="selectedTab === 'category'
                        ? 'bg-[#6D47C4] text-white shadow'
                        : 'text-slate-500 hover:text-slate-700'">

                    By Category

                </button>

            </div>

            <!-- List -->

            <div class="mt-8 space-y-3">

                @for(player of leaderboard; track player.rank){

                    <div

                        class="flex items-center justify-between rounded-2xl border p-4 transition-all"

                        [ngClass]="
                            player.me
                            ? 'border-[#6D47C4] bg-[#F4EEFF] shadow'
                            : 'border-slate-200 bg-white hover:bg-slate-50'
                        ">

                        <div class="flex items-center gap-4">

                            <!-- Rank -->

                            <div
                                class="w-8 text-center font-bold text-slate-600">

                                @switch(player.rank){

                                    @case(1){
                                        🥇
                                    }

                                    @case(2){
                                        🥈
                                    }

                                    @case(3){
                                        🥉
                                    }

                                    @default{
                                        {{player.rank}}
                                    }

                                }

                            </div>

                            <!-- Avatar -->

                            <div
                                class="flex h-11 w-11 items-center justify-center rounded-full bg-[#F4EEFF] text-xl">

                                {{player.avatar}}

                            </div>

                            <!-- Name -->

                            <div>

                                <div class="flex items-center gap-2">

                                    <span
                                        class="font-semibold text-slate-800">

                                        {{player.name}}

                                    </span>

                                    @if(player.me){

                                        <span
                                            class="rounded-full bg-[#6D47C4] px-2 py-1 text-[10px] font-medium text-white">

                                            That's you!

                                        </span>

                                    }

                                </div>

                            </div>

                        </div>

                        <!-- Points -->

                        <span
                            class="text-lg font-bold text-slate-800">

                            {{player.points}}

                            <span class="text-sm font-medium text-slate-500">

                                pts

                            </span>

                        </span>

                    </div>

                }

            </div>

        </app-card>

    </div>

</div>
