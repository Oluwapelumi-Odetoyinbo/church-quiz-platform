<div class="page-shell">
  <div class="page-container page-enter">
    <app-card>
      <app-step-progress [current]="2" [total]="3"></app-step-progress>

      <div class="page-header mt-5">
        <h1 class="page-title">How old are you?</h1>
        <p class="page-subtitle">
          Age helps us pick the right questions for you.
        </p>
      </div>

      <div class="mt-8 grid grid-cols-2 gap-4 lg:grid-cols-4">
        @for (group of ageGroups; track $index) {
          <button
            type="button"
            (click)="selectAge($index)"
            class="selection-card"
            [class.selection-card-active]="selectedAge === $index">
            <div class="text-2xl">{{ group.icon }}</div>
            <h2 class="mt-2 text-base font-semibold">{{ group.age }}</h2>
            <p class="mt-0.5 text-xs uppercase tracking-wide text-slate-400">{{ group.label }}</p>
          </button>
        }
      </div>

      <div class="page-actions">
        <button type="button" (click)="goBack()" class="link-back">← Back</button>
        <app-button size="lg" (buttonClick)="continue()">
          Continue
          <i class="pi pi-arrow-right text-xs"></i>
        </app-button>
      </div>
    </app-card>
  </div>
</div>
